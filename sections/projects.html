<section id="projects" class="section projects" aria-labelledby="projects-title">

    <div class="project-grid" role="list">

      <article class="project-card" role="listitem">

      <article class="project-card" role="listitem">

          <h3>Residential Tower</h3>

      </article>

      <article class="project-card" role="listitem">
        <img
          src="assets/images/rebar-detail.jpg"

          loading="lazy"

        <div class="project-label">
          <h3>Industrial Warehouse</h3>

        </div>

      <article class="project-card" role="listitem">
        <img
          src="assets/images/rebar-model.jpg"

          <h3>Mixed Use Building</h3>

        View All Projects <span aria-hidden="true">→</span>
      </a>

  </div>
</section>
